<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parser Debug</title>
</head>
<body>
    <h1>BibTeX Parser Debug</h1>
    <div id="results"></div>
    
    <script src="assets/bibtex-parser.js"></script>
    <script>
        async function debugParser() {
            const resultsDiv = document.getElementById('results');
            
            try {
                const response = await fetch('assets/publications.bib');
                const content = await response.text();
                
                // Show first entry
                const firstEntryMatch = content.match(/@article\{([^,]+),\s*([\s\S]*?)\n\s*\}/);
                if (firstEntryMatch) {
                    const [, key, entryContent] = firstEntryMatch;
                    
                    resultsDiv.innerHTML = `
                        <h2>First Entry Analysis</h2>
                        <p><strong>Key:</strong> ${key}</p>
                        <h3>Raw Content:</h3>
                        <pre style="background: #f5f5f5; padding: 10px; font-size: 12px; white-space: pre-wrap;">${entryContent}</pre>
                    `;
                    
                    // Test parser
                    const parser = new BibtexParser();
                    parser.parse(content);
                    
                    const entry = parser.getEntry(key);
                    const abstract = parser.getAbstract(key);
                    
                    resultsDiv.innerHTML += `
                        <h3>Parsed Entry:</h3>
                        <pre style="background: #e8f4f8; padding: 10px; font-size: 12px;">${JSON.stringify(entry, null, 2)}</pre>
                        <h3>Abstract Result:</h3>
                        <p style="background: #fff3cd; padding: 10px;"><strong>Abstract:</strong> ${abstract.substring(0, 100)}...</p>
                        <p><strong>Has Abstract Field:</strong> ${!!entry.abstract}</p>
                        <p><strong>Abstract Length:</strong> ${entry.abstract ? entry.abstract.length : 0}</p>
                    `;
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<p>Error: ${error.message}</p>`;
                console.error('Debug error:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', debugParser);
    </script>
</body>
</html>
